# Render blueprint - one web service running the whole app (API + SPA).
# Data lives in an external free Postgres (Neon); set DATABASE_URL in the dashboard.
services:
  - type: web
    name: peerrank
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pin the interpreter so deploys are reproducible and match the Dockerfile.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: DATABASE_URL
        sync: false                  # set to your Neon URL (postgresql+psycopg://...)

      # ---- Google OAuth ----
      # The OAuth client's "Authorized redirect URIs" MUST include
      # <APP_BASE_URL>/auth/google/callback or every sign-in fails.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # REQUIRED. Must exactly equal the origin Google redirects back to, i.e.
      # <APP_BASE_URL>/auth/google/callback must be an Authorized redirect URI
      # on the OAuth client. Set this to the real Render URL after the first
      # deploy (https://<service>.onrender.com) - or to the custom domain, but
      # only once that domain is actually attached and serving.
      - key: APP_BASE_URL
        sync: false
      - key: HTTPS_ONLY
        value: "true"

      # ---- Access control ----
      # REQUIRED. admin_emails defaults to EMPTY, and require_admin guards poll
      # creation itself (app/routers/polls.py) - so with this unset, nobody can
      # create a poll or open the dashboard. Comma-separated, case-insensitive.
      - key: ADMIN_EMAILS
        sync: false
      # Only Google accounts on this domain may sign in (no leading @).
      - key: ALLOWED_EMAIL_DOMAIN
        value: "arcitech.ai"
      # Comma-separated exceptions for voters outside ALLOWED_EMAIL_DOMAIN.
      - key: ALLOWED_EMAIL_EXCEPTIONS
        sync: false

      # ---- Misc ----
      # SPA is served same-origin with the API, and the CORS middleware does not
      # allow credentials, so browsers never send the session cookie
      # cross-origin. "*" is safe here; tighten if you ever split the frontend.
      - key: CORS_ORIGINS
        value: "*"
